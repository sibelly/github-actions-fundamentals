name: Favorite Go CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'favorite-go/**/*.go'
      - 'favorite-go/go.mod'
      - 'favorite-go/go.sum'
      - 'favorite-go/Dockerfile'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - main

env:
  IMAGE_NAME: sibelly/favorite-go

jobs:
  build:
    name: Build favorite-go
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate image tag
        id: vars
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building sibelly/favorite-go:${IMAGE_TAG}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./favorite-go
          file: ./favorite-go/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}

  update-develop:
    name: Update Develop GitOps
    if: github.ref_name == 'develop'
    needs:
      - build
    uses: ./.github/workflows/update-gitops.yml
    with:
      environment: develop
      image: sibelly/favorite-go
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets:
      gitops_token: ${{ secrets.PAT }}
  update-main:
    name: Update Main GitOps
    if: github.ref_name == 'main'
    needs:
      - build
    uses: ./.github/workflows/update-gitops.yml
    with:
      environment: main
      image: sibelly/favorite-go
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets:
      gitops_token: ${{ secrets.PAT }}